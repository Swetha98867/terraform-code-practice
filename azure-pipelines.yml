trigger: none
  paths:
    include:
      - tf-module/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - tf-module/*

variables:
  terraformVersion: '1.9.8'

stages:
- stage: TerraformPlan
  displayName: 'Terraform Plan'

  jobs:
  - job: Plan
    displayName: 'Terraform Init Validate Plan'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: AzureKeyVault@2
      displayName: 'Get VM password from Key Vault'
      inputs:
        azureSubscription: 'ado-terraform'
        KeyVaultName: 'swetha-tf-kv-2026'
        SecretsFilter: 'vm-admin-password'
        RunAsPreJob: false

    - task: AzureCLI@2
      displayName: 'Terraform Init Validate Plan'
      inputs:
        azureSubscription: 'ado-terraform'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/tf-module'
        addSpnToEnvironment: true
        inlineScript: |
          set -e

          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_CLIENT_SECRET="$servicePrincipalKey"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          echo "Terraform Azure authentication configured"
          echo "Subscription ID: $ARM_SUBSCRIPTION_ID"

          terraform init -input=false -no-color
          terraform validate -no-color
          terraform plan -input=false -no-color

      env:
          TF_VAR_admin_password: $(vm-admin-password)

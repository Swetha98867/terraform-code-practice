trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform-vm/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform-vm/*

variables:
  - group: terraform-vm-vars

  - name: terraformVersion
    value: '1.9.8'

stages:
  - stage: TerraformPlan
    displayName: 'Terraform Plan'

    jobs:
      - job: Plan
        displayName: 'Terraform Init Validate Plan'

        pool:
          vmImage: 'ubuntu-latest'

        steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: AzureCLI@2
            displayName: 'Terraform Init Validate Plan'
            inputs:
              azureSubscription: 'ado-terraform'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(Build.SourcesDirectory)/terraform-vm'
              addSpnToEnvironment: true

              inlineScript: |
                set -e

                echo "======================================"
                echo "Terraform Version"
                echo "======================================"
                terraform version

                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(ARM_SUBSCRIPTION_ID)"

                echo "======================================"
                echo "Terraform Init"
                echo "======================================"
                terraform init -input=false -no-color

                echo "======================================"
                echo "Terraform Validate"
                echo "======================================"
                terraform validate -no-color

                echo "======================================"
                echo "Terraform Plan"
                echo "======================================"
                terraform plan -input=false -no-color

                echo "======================================"
                echo "Terraform Plan Completed"
                echo "======================================"

            env:
              TF_VAR_resource_group_name: $(TF_VAR_resource_group_name)
              TF_VAR_location: $(TF_VAR_location)
              TF_VAR_vm_name: $(TF_VAR_vm_name)
              TF_VAR_vm_size: $(TF_VAR_vm_size)
              TF_VAR_admin_username: $(TF_VAR_admin_username)
              TF_VAR_ssh_public_key: $(TF_VAR_ssh_public_key)